<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEXLASH Pixel Icons — All 45</title>
<style>
  :root {
    --hex-arch-predator: #FF4444;
    --hex-arch-sentinel: #4488FF;
    --hex-arch-ghost: #AA88FF;
    --hex-arch-analyst: #44DDDD;
    --hex-arch-maverick: #FFAA00;
    --hex-arch-juggernaut: #FF6600;
    --hex-branch-speed: #00CCFF;
    --hex-branch-power: #FF3333;
    --hex-branch-technique: #33CC33;
    --hex-text-muted: #666666;
    --hex-text-secondary: #A0A0A0;
    --hex-danger: #FF066F;
    --hex-success: #00CC66;
    --hex-warning: #FFAA00;
    --hex-action-defense: #4488FF;
    --hex-dice-heal: #00CC66;
    --hex-dice-adrenaline: #FFAA00;
    --hex-dice-shield: #4488FF;
    --hex-dice-blind: #888888;
    --hex-dice-rage: #FF3333;
    --hex-dice-crit: #FF066F;
    --hex-mode-pve: #00CCFF;
    --hex-mode-pvp: #FF066F;
    --hex-mode-auto: #FFAA00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #090909; color: #fff; font-family: monospace; padding: 24px; }
  h1 { color: #FF066F; margin-bottom: 8px; font-size: 20px; }
  h2 { color: #A0A0A0; margin: 24px 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .icon-card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon-label { font-size: 10px; color: #808080; }
  .icon-pixels { font-size: 9px; color: #555; }
  canvas { image-rendering: pixelated; border: 1px solid #222; }
  .summary { margin-top: 32px; font-size: 11px; color: #808080; }
</style>
</head>
<body>
<h1>HEXLASH Pixel Icons</h1>
<p style="color:#666;font-size:12px;margin-bottom:16px">45 icons · 16×16 grid · rendered at 48px</p>

<div id="app"></div>
<div class="summary" id="summary"></div>

<script type="module">
import { pixelIcons } from './src/data/pixelIcons.js';

const categories = {
  'Archetypes': ['predator','sentinel','ghost','analyst','maverick','juggernaut'],
  'Branches': ['speed','power','technique'],
  'Navigation': ['arena','training','ratings','profile'],
  'Combat': ['hp','shield','dice','coach','damage','heal'],
  'Dice Effects': ['dice_heal','dice_adrenaline','dice_shield','dice_blind','dice_rage','dice_crit'],
  'Modes': ['pve','pvp','auto'],
  'Social': ['friends','club','challenge','search','online','spectate'],
  'Progression': ['xp','taps','lock','unlock','star'],
  'UI': ['close','menu','settings','sound','wallet','back']
};

const app = document.getElementById('app');
const SIZE = 48;
let totalIcons = 0;

function resolveColor(c) {
  const m = c.match(/var\(--(.+)\)/);
  if (!m) return c;
  return getComputedStyle(document.documentElement).getPropertyValue('--' + m[1]).trim() || '#fff';
}

function renderIcon(name, icon) {
  const canvas = document.createElement('canvas');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const px = SIZE / 16;
  const color = resolveColor(icon.defaultColor);
  ctx.fillStyle = color;
  for (let i = 0; i < 256; i++) {
    if (icon.grid[i]) {
      const x = (i % 16) * px;
      const y = Math.floor(i / 16) * px;
      ctx.fillRect(x, y, px, px);
    }
  }
  return canvas;
}

for (const [catName, icons] of Object.entries(categories)) {
  const h2 = document.createElement('h2');
  h2.textContent = catName;
  app.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (const name of icons) {
    const icon = pixelIcons[name];
    if (!icon) continue;
    totalIcons++;
    const count = icon.grid.reduce((s,v) => s+v, 0);
    const card = document.createElement('div');
    card.className = 'icon-card';
    card.appendChild(renderIcon(name, icon));
    const label = document.createElement('div');
    label.className = 'icon-label';
    label.textContent = name;
    card.appendChild(label);
    const px = document.createElement('div');
    px.className = 'icon-pixels';
    px.textContent = count + 'px · ' + (count/256*100).toFixed(0) + '%';
    card.appendChild(px);
    grid.appendChild(card);
  }
  app.appendChild(grid);
}

document.getElementById('summary').textContent = 'Total: ' + totalIcons + ' icons rendered';
</script>
</body>
</html>
