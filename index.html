    <meta charset="UTF-8">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Цвет верхнего статус-бара -->
    <meta name="theme-color" content="#000000">

    <title>Hexlash — Web3 Turn-Based Fighter</title>
    <meta name="description" content="Pick your archetype, build your loadout, dominate the arena. Web3 PvP fighting game on Base.">

    <!-- Open Graph (static — social crawlers don't run JS) -->
    <meta property="og:title" content="Hexlash — Web3 Turn-Based Fighter">
    <meta property="og:description" content="Pick your archetype, build your loadout, dominate the arena. Web3 PvP fighting game on Base.">
    <meta property="og:image" content="https://hexlash.com/og-image.png">
    <meta property="og:url" content="https://hexlash.com/">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hexlash — Web3 Turn-Based Fighter">
    <meta name="twitter:description" content="Pick your archetype, build your loadout, dominate the arena. Web3 PvP fighting game on Base.">
    <meta name="twitter:image" content="https://hexlash.com/og-image.png">

    <link rel="preload" href="/src/assets/fonts/Anonymous.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/src/assets/fonts/AnonymousBalance.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-bg) transparent;
        }

        #app-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            opacity: 1;
        }

        #loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .loading-hexlash {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 72px;
            font-weight: 900;
            color: #FF066F;
            letter-spacing: 14px;
            text-transform: uppercase;
            user-select: none;
            font-family: Anonymous, monospace;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(255, 6, 111, 0.5);
        }

        .loading-never-give-up {
            font-size: 42px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: center;
            width: 100%;
            z-index: 1;
            font-family: Anonymous, monospace;
            text-shadow:
                0 0 20px #FF066F,
                0 0 40px rgba(255, 6, 111, 0.4);
        }

        .loader-app {
            margin-top: 32px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #FF066F;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #app-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app-loading">
    <div id="loading-container">
        <div class="loading-hexlash">HEXLASH</div>
        <div class="loading-never-give-up">Never give up</div>
        <div class="loader-app"></div>
    </div>
</div>
<div id="app"></div>
<script>
    window.onload = () => {
        console.log("App loaded");
        const loadingScreen = document.getElementById('app-loading');
        loadingScreen.classList.add('hidden');
        loadingScreen.addEventListener('transitionend', () => {
            loadingScreen.style.display = 'none';
        });
    };
</script>
<script src="/telegram-web.js"></script>
<script src="/ammo.wasm.js"></script>
<script type="module" src="/src/main.js"></script>

</body>
</html>
