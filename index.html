    <!-- Brand typefaces: Saira Condensed (display) + JetBrains Mono
         (telemetry/meta), loaded below. Canon faces used app-wide (shell,
         auth, peripheral views) and on the landing via the `.lp` root. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking webfont load: render with system fallbacks first (the
         pre-load splash + landing both declare fallbacks), swap brand faces in
         when they arrive. `preload as=style` + rel-flip never blocks first paint. -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"

              href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-bg) transparent;
        }

        /* ════════════════════════════════════════════════════════════════
           HEXLASH PRE-LOAD — CRITICAL CSS (direction B · "Fight Card").
           Renders instantly, before the game bundle/stylesheet load. Colours
           are inlined literals (canon pink #FF0069) because --hex-* tokens
           aren't loaded yet. Scoped under #hx-load / .hxl-* — no app clash.
           Reads on system-font fallbacks the moment it paints; the brand
           faces (Saira Condensed / JetBrains Mono) swap in non-blocking. */
        #hx-load {
            --accent: #ff0069;
            --accent-rgb: 255, 0, 105;
            --void: #08080a;
            --bone: #f6f4f6;
            --ash: #6e6a72;
            --impact: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
            --tele: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

            position: fixed;
            inset: 0;
            z-index: 2147483000;
            overflow: hidden;
            color: var(--bone);
            font-family: var(--tele);
            -webkit-font-smoothing: antialiased;
            user-select: none;
            background: radial-gradient(130% 80% at 50% 120%, #1a0010 0%, #0b060a 46%, var(--void) 82%);
            /* Leave — must match LOADING.FADE_OUT_MS in src/services/sceneLoading.js,
               so the first-load surface and the in-app one lift identically. */
            transition: opacity .2s ease;
        }
        #hx-load.hxl-out { opacity: 0; pointer-events: none; }
        #hx-load * { box-sizing: border-box; margin: 0; }

        /* HUD corner brackets */
        .hxl-hud i { position: absolute; width: 5vmin; height: 5vmin; border: 0 solid rgba(var(--accent-rgb), .55); }
        .hxl-hud i.tl { top: 4vmin; left: 4vmin; border-left-width: 1.6px; border-top-width: 1.6px; }
        .hxl-hud i.tr { top: 4vmin; right: 4vmin; border-right-width: 1.6px; border-top-width: 1.6px; }
        .hxl-hud i.bl { bottom: 4vmin; left: 4vmin; border-left-width: 1.6px; border-bottom-width: 1.6px; }
        .hxl-hud i.br { bottom: 4vmin; right: 4vmin; border-right-width: 1.6px; border-bottom-width: 1.6px; }

        /* Top lockup: mark + wordmark */
        .hxl-top { position: absolute; top: 8vmin; left: 0; right: 0;
            display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
        .hxl-lock { display: flex; align-items: center; gap: 2.4vmin; }
        .hxl-word { font-family: var(--impact); font-weight: 900; text-transform: uppercase;
            font-size: 8vmin; letter-spacing: .02em; }

        /* Centerpiece: hero percent + creed */
        .hxl-mid { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1vmin; }
        .hxl-num { font-family: var(--impact); font-weight: 900; line-height: .84;
            font-size: 38vmin; letter-spacing: -.01em; color: #fff;
            text-shadow: 0 0 5vmin rgba(var(--accent-rgb), .35); font-variant-numeric: tabular-nums; }
        .hxl-num sup { font-size: .26em; color: var(--accent); vertical-align: .9em; margin-left: .06em;
            text-shadow: 0 0 2vmin rgba(var(--accent-rgb), .8); }
        .hxl-creed { font-family: var(--impact); font-weight: 800; text-transform: uppercase;
            font-size: 6.4vmin; letter-spacing: .04em; color: var(--bone); white-space: nowrap; }
        .hxl-creed b { color: #fff; text-shadow: 0 0 1vmin rgba(var(--accent-rgb), .7), 0 0 4vmin rgba(var(--accent-rgb), .6); }

        /* Footer: progress bar + rotating field note */
        .hxl-foot { position: absolute; left: 0; right: 0; bottom: 8.5vmin;
            display: flex; flex-direction: column; align-items: center; gap: 3vmin; padding: 0 6vmin; }
        .hxl-bar { position: relative; width: 54vmin; max-width: 560px; height: 3px; background: rgba(255, 255, 255, .10);
            clip-path: polygon(2vmin 0, 100% 0, calc(100% - 2vmin) 100%, 0 100%); }
        .hxl-fill { position: absolute; inset: 0; width: calc(var(--p, 0) * 1%); background: var(--accent);
            box-shadow: 0 0 9px rgba(var(--accent-rgb), .9); transition: width .35s ease; }
        .hxl-tip { display: flex; align-items: center; gap: 2.4vmin; max-width: 90vw; text-align: center; }
        .hxl-tag { flex: none; font-size: 2.3vmin; letter-spacing: .2em; color: var(--accent);
            border: 1px solid rgba(var(--accent-rgb), .4); padding: .8vmin 1.6vmin; text-transform: uppercase; }
        .hxl-line { font-size: 2.6vmin; letter-spacing: .12em; color: #bdb9c2; text-transform: uppercase; }

        /* ── Portrait / mobile ─────────────────────────────────────────── */
        @media (max-aspect-ratio: 1/1) {
            .hxl-num { font-size: 30vmin; }
            .hxl-bar { width: 70vmin; }
            .hxl-hud i { width: 6vmin; height: 6vmin; }
            .hxl-word { font-size: 10vmin; }
            .hxl-creed { font-size: 8vmin; }
            .hxl-tag { font-size: 3vmin; }
            .hxl-line { font-size: 3.2vmin; }
        }

        /* ── Respect reduced-motion ────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            #hx-load * { animation: none !important; }
            .hxl-fill { transition: none; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════════════════════════
     HEXLASH PRE-LOAD (direction B · "Fight Card"). First thing in <body>, runs
     standalone. Real progress is driven from src/main.js via window.HexlashLoader
     (.set(pct) on bootstrap milestones, .done() on the arena's first frame). -->
<div id="hx-load" style="--p:0">
    <div class="hxl-hud" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

    <header class="hxl-top">
        <div class="hxl-lock">
            <span class="hxl-word">HEXLASH</span>
        </div>
    </header>

    <div class="hxl-mid">
        <div class="hxl-num" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="hxl-num-v">00</span><sup>%</sup></div>
        <div class="hxl-creed">NEVER <b>GIVE UP.</b></div>
    </div>

    <div class="hxl-foot">
        <div class="hxl-bar"><i class="hxl-fill"></i></div>
        <div class="hxl-tip"><span class="hxl-tag">FIELD NOTE</span><span class="hxl-line">THE BELL IS ABOUT TO RING.</span></div>
    </div>
</div>

<script>
/* Hexlash pre-load controller — vanilla, dependency-free. The FIRST-LOAD surface
   of the one loading screen; its twin is SceneLoadingOverlay.vue, and both render
   the same state (src/services/sceneLoading.js).
   Public API (driven from src/main.js):
     HexlashLoader.set(pct)   // 0..100 — bootstrap milestones, then the scene's
                              //          real build stages via the controller
     HexlashLoader.done()     // 100% + fade out + remove from DOM
     HexlashLoader.handoff()  // remove NOW, no fade — the in-app overlay is taking
                              //          over this same picture */
(function () {
  var el = document.getElementById('hx-load');
  if (!el) return;
  var fill  = el.querySelector('.hxl-fill');
  var numV  = el.querySelector('.hxl-num-v');
  var bar   = el.querySelector('.hxl-num');
  var creed = el.querySelector('.hxl-creed');
  var tag   = el.querySelector('.hxl-tag');
  var line  = el.querySelector('.hxl-line');

  var TIPS = [
    'THE BELL IS ABOUT TO RING.',
    'RESPECT THE GRIND. NOTHING IS HANDED OUT.',
    'READ YOUR OPPONENT. THEN STRIKE.',
    'STEP IN. THE ARENA IS WAITING.'
  ];
  var ti = 0, tipTimer = null, completed = false;
  function pad(n){ n = Math.round(n); return n < 10 ? '0' + n : '' + n; }
  function rotateTip(){ line.textContent = TIPS[ti++ % TIPS.length]; tipTimer = setTimeout(rotateTip, 3200); }
  function startTips(){ if (!tipTimer) tipTimer = setTimeout(rotateTip, 3200); }
  function stopTips(){ clearTimeout(tipTimer); tipTimer = null; }

  function complete(){
    if (completed) return; completed = true; stopTips();
    creed.innerHTML = 'STEP <b>IN.</b>';
    tag.textContent = 'ARENA READY';
    line.textContent = 'PRESS TO ENTER THE CAGE.';
  }
  function restoreLoading(){            /* lets the bar recover if progress dips */
    if (!completed) return; completed = false;
    creed.innerHTML = 'NEVER <b>GIVE UP.</b>';
    tag.textContent = 'FIELD NOTE';
    ti = 0; rotateTip();
  }

  var Loader = {
    set: function (p) {
      p = Math.max(0, Math.min(100, +p || 0));
      el.style.setProperty('--p', p);
      numV.textContent = pad(p);
      bar.setAttribute('aria-valuenow', Math.round(p));
      if (p >= 100) complete(); else restoreLoading();
      return p;
    },
    /* Lift. No hold of its own any more: the loading controller
       (src/services/sceneLoading.js) owns the minimum show time, for BOTH
       surfaces, so holding again here would double it. */
    done: function () {
      this.set(100);
      el.classList.add('hxl-out');
      stopTips();
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
    },
    /* Hand over to the in-app overlay (SceneLoadingOverlay). Same picture, so a
       crossfade between the two would just read as a flicker — this one goes in
       the same tick the other one comes up. */
    handoff: function () {
      stopTips();
      if (el.parentNode) el.parentNode.removeChild(el);
    }
  };

  startTips();
  window.HexlashLoader = Loader;
})();
</script>
