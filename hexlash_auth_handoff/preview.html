<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<title>Hexlash Auth — single screen</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>html,body{margin:0;height:100%;background:#08080a}#r{position:fixed;inset:0}</style></head>
<body><div id="r"></div>
<!-- Full-screen render of the auth component, no canvas chrome.
     Pass a state via ?v=  →  live | default | more | email-empty | email-focus | email-filled | email-error -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="auth_parts.jsx"></script>
<script type="text/babel" src="auth_screen.jsx"></script>
<script type="text/babel">
const v = new URLSearchParams(location.search).get('v') || 'live';
ReactDOM.createRoot(document.getElementById('r')).render(<AuthScreen variant={v} tw={{}} />);
</script></body></html>
