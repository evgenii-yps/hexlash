<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hexlash — Auth Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#0d0a0d;}
  #root{height:100vh;}
  /* spec sheet (on-brand dark) */
  .spec{position:absolute;inset:0;background:#08080a;color:#f6f4f6;overflow:hidden;
    font-family:"JetBrains Mono",monospace;padding:40px 44px;
    background-image:radial-gradient(120% 80% at 50% -10%, #160a11 0%, #0b070a 44%, #08080a 78%);}
  .spec h3{font-family:"Saira Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:13px;letter-spacing:.26em;color:#ff0069;margin:0 0 18px;}
  .spec-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:38px;}
  .sw{display:flex;flex-direction:column;gap:9px;}
  .sw-row{display:flex;align-items:center;gap:12px;}
  .sw-chip{width:30px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.1);flex:0 0 auto;}
  .sw-name{font-size:12px;letter-spacing:.04em;color:#f6f4f6;}
  .sw-hex{font-size:11px;color:#6e6a72;margin-top:1px;}
  .spec-line{display:flex;justify-content:space-between;font-size:11.5px;color:#bdb9c2;
    padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);letter-spacing:.03em;}
  .spec-line b{color:#f6f4f6;font-weight:500;}
  .spec-note{font-size:10.5px;color:#6e6a72;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px;}
  .tdisp{font-family:"Saira Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:40px;line-height:.9;}
  .tmono{font-size:13px;letter-spacing:.2em;color:#bdb9c2;margin-top:10px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="auth_parts.jsx"></script>
<script type="text/babel" src="auth_screen.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#ff0069",
  "glow": true,
  "motif": true,
  "cardw": 364,
  "headline": "WELCOME"
}/*EDITMODE-END*/;

function SpecSheet() {
  const colors = [
    ['Lash Pink', '#ff0069', 'Accent — submit + focus only'],
    ['Void', '#08080a', 'Base background'],
    ['Carbon', '#0d0a0d', 'Canvas / surface'],
    ['Bone', '#f6f4f6', 'Primary text'],
    ['Ash', '#6e6a72', 'Muted / meta'],
    ['Error', '#d6534c', 'Validation only'],
  ];
  return (
    <div className="spec">
      <div className="spec-grid">
        <div>
          <h3>Palette</h3>
          <div className="sw">
            {colors.map(([n, h, d]) => (
              <div className="sw-row" key={h}>
                <span className="sw-chip" style={{ background: h }}></span>
                <div>
                  <div className="sw-name">{n} · <span style={{ color: '#6e6a72' }}>{h.toUpperCase()}</span></div>
                  <div className="sw-hex">{d}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div>
          <h3>Type</h3>
          <div className="spec-note">Display · Saira Condensed</div>
          <div className="tdisp">WELCOME</div>
          <div className="spec-note" style={{ marginTop: 22 }}>UI · JetBrains Mono</div>
          <div className="tmono">SELECT YOUR PREFERRED<br/>LOGIN OPTION</div>
        </div>
        <div>
          <h3>Spec</h3>
          <div className="spec-line"><span>Card width</span><b>372px</b></div>
          <div className="spec-line"><span>Card radius</span><b>16px</b></div>
          <div className="spec-line"><span>Method button</span><b>52px · r10</b></div>
          <div className="spec-line"><span>Email field</span><b>54px · r11</b></div>
          <div className="spec-line"><span>Title size</span><b>34px / 800</b></div>
          <div className="spec-line"><span>Button label</span><b>12.5px · .16em</b></div>
          <div className="spec-line"><span>Accents per screen</span><b>1 · submit</b></div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const tw = { accent: t.accent, glow: t.glow, motif: t.motif, cardw: t.cardw, headline: t.headline };
  const W = 1140, H = 712;

  const states = [
    ['default', 'Default · methods'],
    ['more', 'More options'],
    ['email-empty', 'Email · empty'],
    ['email-focus', 'Email · focus'],
    ['email-filled', 'Email · filled'],
    ['email-error', 'Email · error'],
  ];

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="live" title="Hexlash — Auth" subtitle="Live · click through the whole flow">
          <DCArtboard id="live-1" label="Interactive" width={W} height={H}>
            <AuthScreen variant="live" tw={tw} />
          </DCArtboard>
        </DCSection>

        <DCSection id="states" title="States" subtitle="Every state for handoff — default → more → email (empty / focus / filled / error)">
          {states.map(([v, label]) => (
            <DCArtboard id={'st-' + v} label={label} width={W} height={H} key={v}>
              <AuthScreen variant={v} tw={tw} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="spec" title="Spec" subtitle="Values for the Vue build">
          <DCArtboard id="spec-1" label="Palette · type · sizes" width={W} height={420}>
            <SpecSheet />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Accent" />
        <TweakColor label="Accent" value={t.accent}
          options={['#ff0069', '#00e5ff', '#b026ff', '#39ff14']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakToggle label="Glow (focus / submit)" value={t.glow}
          onChange={(v) => setTweak('glow', v)} />
        <TweakSection label="Backdrop" />
        <TweakToggle label="Hex lattice motif" value={t.motif}
          onChange={(v) => setTweak('motif', v)} />
        <TweakSection label="Layout" />
        <TweakSlider label="Card width" value={t.cardw} min={336} max={420} step={4} unit="px"
          onChange={(v) => setTweak('cardw', v)} />
        <TweakText label="Headline" value={t.headline}
          onChange={(v) => setTweak('headline', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
