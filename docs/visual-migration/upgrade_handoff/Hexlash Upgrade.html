<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hexlash — Прокачка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="scene" id="scene">
  <div class="device" id="device">
    <!-- ЭКРАН ПРОКАЧКИ · холст 430×932, темится в --core -->
    <div class="screen" id="upg" data-level="core" data-screen-label="Прокачка">

      <!-- статус-бар -->
      <div class="s-status">
        <span>9:41</span>
        <span class="sig"><b></b>ПОДГОТОВКА К БОЮ</span>
      </div>

      <!-- назад + крошки + имя ядра -->
      <div class="s-top">
        <button class="back" aria-label="Назад">
          <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"></polyline></svg>
        </button>
        <div class="crumb">
          <span class="lvl-core">Ядро</span><span class="sep">·</span>
          <span class="lvl-crystal">Кристалл</span><span class="sep">·</span>
          <span class="lvl-face">Грань</span>
        </div>
        <div class="core-tag">
          <span class="nm">—</span>
          <span class="ix">ЯДРО —</span>
        </div>
      </div>

      <!-- сцена глубины -->
      <div class="stage">
        <svg class="spokes" preserveAspectRatio="none"></svg>

        <!-- ЯДРО — единственное свечение -->
        <div class="core-node" role="button" tabindex="0" aria-label="Раскрыть кристаллы ядра">
          <div class="glow"></div>
          <div class="ring"></div>
          <div class="glyph"></div>
        </div>
        <div class="core-hint">тап по ядру</div>

        <!-- КРИСТАЛЛЫ — раскрываются по радиусу (инжектятся upgrade.js) -->
        <div class="crystals"></div>
      </div>

      <!-- низ: общий пул очков ядра + «В БОЙ» + демо-свитчер -->
      <div class="s-bottom">
        <div class="pool">
          <div class="lbl">
            <span class="k">Очки ядра · общий пул</span>
            <span class="v"><b class="pool-free">5</b> / <span class="pool-total">5</span> свободно</span>
          </div>
          <div class="pips"></div>
        </div>
        <button class="tobattle">В бой <span class="arr">→</span></button>
        <div class="coresel">
          <span class="dlab">// демо · свап --core:</span>
        </div>
      </div>

      <!-- ПАНЕЛЬ ГРАНЕЙ -->
      <div class="facepanel">
        <div class="fp-head">
          <div class="ttl"><small>Кристалл</small><span class="cr-name">—</span></div>
        </div>
        <div class="meter">
          <div class="cell">
            <span class="k">Зажжено · лимит кристалла</span>
            <span class="limit">0<small>/0</small></span>
          </div>
          <div class="cell">
            <span class="k">Очки ядра</span>
            <div class="pips"></div>
            <span class="free">0<small> своб.</small></span>
          </div>
        </div>
        <div class="faces"></div>
        <div class="fp-foot">
          <span class="hint">зажёг одно — погаси другое</span>
          <span class="stub">эффекты — заглушки</span>
        </div>
      </div>

      <div class="wm">HEXLASH · контент — заглушки</div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="upgrade.js"></script>
</body>
</html>
