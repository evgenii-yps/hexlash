<svg width="68" height="50" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scratchCyan" x1="0" y1="1" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scratchRed" x1="0.5" y1="0.5" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff1744" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <linearGradient id="textUnderCyan" x1="0" y1="0" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textUnderRed" x1="0.7" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal frame - stylized angular hex -->
  <path d="M100 8 L155 28 L155 78 L100 98 L45 78 L45 28 Z" fill="none" stroke="white" stroke-width="6" stroke-linejoin="bevel"/>

  <!-- Inner hex detail -->
  <path d="M100 18 L145 34 L145 72 L100 88 L55 72 L55 34 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="bevel" opacity="0.3"/>

  <!-- Diagonal scratch marks through the hex -->
  <!-- Scratch 1 (left) -->
  <line x1="38" y1="88" x2="120" y2="12" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="38" y1="88" x2="75" y2="53" stroke="url(#scratchCyan)" stroke-width="5" stroke-linecap="round"/>

  <!-- Scratch 2 (center) -->
  <line x1="58" y1="92" x2="142" y2="14" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="105" y1="48" x2="142" y2="14" stroke="url(#scratchRed)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Scratch 3 (right) -->
  <line x1="72" y1="95" x2="158" y2="18" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="118" y1="53" x2="158" y2="18" stroke="url(#scratchRed)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- HEXLASH text -->
  <text x="100" y="130" text-anchor="middle" fill="white" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="32" font-style="italic" letter-spacing="4">HEXLASH</text>

  <!-- Colored accent lines under text -->
  <line x1="32" y1="137" x2="80" y2="137" stroke="url(#textUnderCyan)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="137" x2="168" y2="137" stroke="url(#textUnderRed)" stroke-width="2" stroke-linecap="round"/>
</svg>
